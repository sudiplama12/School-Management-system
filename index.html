<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/crest.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart LMS · School Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Baloo 2 is the rounded display face, Mukta the body face; both carry a
         Devanagari subset, so one pair covers English and Nepali. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Mukta:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Runs before first paint so a reload never shows the wrong palette.
      // ThemeProvider takes the same five values over once React mounts.
      (function () {
        try {
          var root = document.documentElement;
          var saved = localStorage.getItem("lms_theme");
          var dark =
            saved === "dark" ||
            ((saved === null || saved === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);

          root.classList.toggle("dark", dark);
          root.style.colorScheme = dark ? "dark" : "light";

          // Emerald is the only palette index.css was written with; a first
          // visit paints with ocean, which is why the fallback is not emerald.
          var accent = localStorage.getItem("lms_accent") || "ocean";
          if (accent !== "emerald") root.setAttribute("data-accent", accent);

          var wallpaper = localStorage.getItem("lms_wallpaper");
          if (wallpaper && wallpaper !== "plain") {
            root.setAttribute("data-wallpaper", wallpaper);
          }

          // "solid" is the default surface and needs no attribute at all.
          var surface = localStorage.getItem("lms_surface");
          if (surface === "frosted" || surface === "glass") {
            root.setAttribute("data-surface", surface);
          }

          // "full" is the normal degree and needs no attribute at all.
          var motion = localStorage.getItem("lms_motion");
          if (motion === "reduced" || motion === "rich") {
            root.setAttribute("data-motion", motion);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
